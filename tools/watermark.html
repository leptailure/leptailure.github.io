<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Leptailure · 批量水印</title>
<style>
:root{--bg:#f5f3ed;--ink:#202b27;--muted:#626b64;--line:#d6d9ce;--accent:#a4462f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(1050px,calc(100% - 40px));margin:40px auto 70px}h1{font-size:clamp(30px,5vw,54px);font-weight:550;letter-spacing:-1.6px;margin:10px 0}h2{font-size:20px;font-weight:550;margin:0 0 18px}
a{color:inherit}.muted{color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:1px;color:var(--accent)}
.panel{background:#fffef9;border:1px solid var(--line);padding:26px;margin:22px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:block;font-weight:600;margin-bottom:6px}
input[type=text],input[type=file]{width:100%;padding:10px 12px;border:1px solid #aeb8ac;background:white;font:inherit}
input[type=range]{width:100%;accent-color:var(--accent)}.field-value{float:right;color:var(--accent)}
button{border:0;background:var(--ink);color:#fff;padding:13px 21px;font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}.secondary{border:1px solid var(--ink);background:transparent;color:var(--ink)}
.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.status{min-height:23px;color:var(--muted)}
canvas{display:block;width:100%;height:auto;max-height:620px;object-fit:contain;background:#e2e4dc;border:1px solid var(--line)}
.note{font-size:12px;color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:1fr}.panel{padding:16px}}
</style>
</head>
<body><main>
<a href="../">← Leptailure</a>
<p class="eyebrow">OWNER TOOL / LOCAL IMAGE PROCESSING</p>
<h1>批量图片水印</h1>
<p class="muted">在浏览器本地直接给图片添加密集的斜向文字水印，支持批量 ZIP 导出。图片不会上传服务器，原文件不会修改。</p>
<section class="panel">
<h2>1. 选择图片</h2>
<input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple>
<p id="count" class="muted">尚未选择文件</p>
<div class="grid">
<div><label for="mark">水印文字</label><input id="mark" type="text" value="LEPTAILURE · leptailure.github.io" maxlength="100"></div>
<div><label for="opacity">透明度 <span id="opacity-value" class="field-value">28%</span></label><input id="opacity" type="range" min="10" max="50" value="28"></div>
<div><label for="density">覆盖密度 <span id="density-value" class="field-value">中</span></label><input id="density" type="range" min="1" max="3" value="2"></div>
<div><label for="angle">倾斜角度 <span id="angle-value" class="field-value">-27°</span></label><input id="angle" type="range" min="-45" max="45" value="-27"></div>
</div>
</section>
<section class="panel">
<h2>2. 预览与导出</h2>
<canvas id="preview" width="900" height="460" aria-label="第一张照片的水印预览"></canvas>
<p class="note">预览使用第一张图片；下载 ZIP 会处理所有已选图片。水印直接写入像素，但仍不能完全阻止恶意去水印。</p>
<div class="actions"><button id="export" disabled>批量处理并下载 ZIP</button><button id="reset" class="secondary" type="button">重置</button><span id="status" class="status" role="status"></span></div>
</section>
<p class="note">如需处理已发布网站中的图片，可在项目仓库使用 tools/batch_watermark.py。推荐先保留本地无水印原图。</p>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('preview');
const allowed=/\.(jpe?g|png|webp)$/i;
let files=[], previewRun=0;
function readSettings(){
 return {text:$('mark').value.trim()||'LEPTAILURE', alpha:Number($('opacity').value)/100,
   density:Number($('density').value), angle:Number($('angle').value)};
}
function setLabels(){
 $('opacity-value').textContent=$('opacity').value+'%';
 $('density-value').textContent=['','疏','中','密'][Number($('density').value)];
 $('angle-value').textContent=$('angle').value+'°';
}
async function paint(file){
 const bitmap=await createImageBitmap(file);
 try{
   const c=document.createElement('canvas');c.width=bitmap.width;c.height=bitmap.height;
   const ctx=c.getContext('2d',{alpha:false});ctx.drawImage(bitmap,0,0);
   const s=readSettings(),w=c.width,h=c.height,short=Math.min(w,h);
   const font=Math.max(18,Math.min(70,short*.073));
   ctx.save();ctx.translate(w/2,h/2);ctx.rotate(s.angle*Math.PI/180);
   ctx.font='700 '+Math.round(font)+'px Arial, sans-serif';ctx.textBaseline='middle';ctx.textAlign='center';
   const textWidth=ctx.measureText(s.text).width,extent=Math.hypot(w,h)*.78;
   const stepX=Math.max(textWidth+Math.max(20,font*.35),short*1.25/s.density);
   const stepY=Math.max(font*2.1,short*.22/s.density);
   ctx.globalAlpha=s.alpha;ctx.lineWidth=Math.max(1.4,font*.045);ctx.strokeStyle='rgba(0,0,0,.85)';ctx.fillStyle='#fff';
   let row=0;
   for(let y=-extent;y<=extent;y+=stepY,row++)
     for(let x=-extent+(row%2)*stepX/2;x<=extent;x+=stepX){ctx.strokeText(s.text,x,y);ctx.fillText(s.text,x,y);}
   ctx.restore();return c;
 }finally{bitmap.close();}
}
async function updatePreview(){
 const run=++previewRun;setLabels();
 if(!files.length){const ctx=canvas.getContext('2d');ctx.fillStyle='#e2e4dc';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#626b64';ctx.font='24px sans-serif';ctx.textAlign='center';ctx.fillText('请选择图片预览',canvas.width/2,canvas.height/2);return;}
 try{const result=await paint(files[0]);if(run!==previewRun)return;canvas.width=result.width;canvas.height=result.height;canvas.getContext('2d').drawImage(result,0,0);}
 catch(e){$('status').textContent='预览错误：'+e.message;}
}
$('files').addEventListener('change',()=>{files=[...$('files').files].filter(f=>allowed.test(f.name));$('count').textContent='已选 '+files.length+' 张图片';$('export').disabled=!files.length;updatePreview();});
for(const id of ['mark','opacity','density','angle'])$(id).addEventListener('input',updatePreview);
$('reset').addEventListener('click',()=>{$('files').value='';files=[];$('mark').value='LEPTAILURE · leptailure.github.io';$('opacity').value='28';$('density').value='2';$('angle').value='-27';$('export').disabled=true;$('count').textContent='尚未选择文件';$('status').textContent='';updatePreview();});
function u16(x){return [x&255,x>>>8&255];}
function u32(x){return [x&255,x>>>8&255,x>>>16&255,x>>>24&255];}
const crcTable=(()=>{let t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(bytes){let c=0xFFFFFFFF;for(const b of bytes)c=crcTable[(c^b)&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zip(files){
 const out=[],index=[],enc=new TextEncoder();let offset=0;
 for(const f of files){
   const name=enc.encode(f.name),data=f.bytes,crc=crc32(data),sz=data.length;
   const local=Uint8Array.from([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(33),...u32(crc),...u32(sz),...u32(sz),...u16(name.length),...u16(0)]);
   out.push(local,name,data);
   const central=Uint8Array.from([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(33),...u32(crc),...u32(sz),...u32(sz),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset)]);
   index.push(central,name);offset+=local.length+name.length+sz;
 }
 const centralSize=index.reduce((n,c)=>n+c.length,0),count=files.length;
 const end=Uint8Array.from([...u32(0x06054b50),...u16(0),...u16(0),...u16(count),...u16(count),...u32(centralSize),...u32(offset),...u16(0)]);
 return new Blob([...out,...index,end],{type:'application/zip'});
}
function toBlob(c,type){return new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(new Error('编码失败')),type,.93));}
$('export').addEventListener('click',async()=>{
 if(!files.length)return;const btn=$('export');btn.disabled=true;let total=0;
 try{
  const zipFiles=[];const unique=new Set();
  for(let i=0;i<files.length;i++){
   $('status').textContent='正在处理 '+(i+1)+' / '+files.length;
   const f=files[i],image=await paint(f),type=/\.png$/i.test(f.name)?'image/png':/\.webp$/i.test(f.name)?'image/webp':'image/jpeg';
   const blob=await toBlob(image,type),bytes=new Uint8Array(await blob.arrayBuffer());
   const ext=type==='image/png'?'.png':type==='image/webp'?'.webp':'.jpg';
   let base=f.name.replace(/\.[^.]+$/,'').replace(/[\/\\:*?"<>|]/g,'_'),name=base+'-watermarked'+ext,n=2;
   while(unique.has(name))name=base+'-watermarked-'+(n++)+ext;
   unique.add(name);zipFiles.push({name,bytes});total+=bytes.length;
  }
  const blob=zip(zipFiles),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='leptailure-watermarked-'+new Date().toISOString().slice(0,10)+'.zip';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),60000);$('status').textContent='完成：'+zipFiles.length+' 张，'+(total/1048576).toFixed(1)+' MB';
 }catch(e){$('status').textContent='处理失败：'+e.message;}finally{btn.disabled=false;}
});
updatePreview();
</script></body></html>
